<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Array Sort and Reverse</title>
</head>
<body>
   <script>
        const names = ["raju", "anju", "sanju", "anil"];
        console.log("Original array:", names);

        const sortedNames = [...names].sort();
        console.log("Alphabetically sorted:", sortedNames);

        const reversedNames = [...names].reverse();
        console.log("Reversed order:", reversedNames);
    </script>
</body>
</html>
