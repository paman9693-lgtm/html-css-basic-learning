<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naam ki Suchi</title>
    <style>
        body {
            max-width: 520px;
            margin: 40px auto;
            padding: 0 16px;
            font-family: Arial, sans-serif;
        }

        form {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 8px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }

        li {
            margin: 10px 0;
        }

        li button {
            margin-left: 12px;
        }

        #message {
            color: #b00020;
        }
    </style>
</head>
<body>
    <h1>Naam ki Suchi</h1>
    <p>Naya naam jodein ya suchi se kisi naam ko hataein.</p>

    <form id="name-form">
        <label for="name-input">Naam:</label>
        <input id="name-input" type="text" autocomplete="off" required>
        <button type="submit">Jodein</button>
    </form>

    <p id="message" aria-live="polite"></p>
    <p>Suchi mein kul naam: <strong id="name-count">0</strong></p>
    <ul id="name-list"></ul>

    <script>
        const names = ["Raju", "Sanju", "Anil", "Anju"];
        const form = document.getElementById("name-form");
        const input = document.getElementById("name-input");
        const list = document.getElementById("name-list");
        const count = document.getElementById("name-count");
        const message = document.getElementById("message");

        function renderNames() {
            list.replaceChildren();
            count.textContent = names.length;

            names.forEach((name, index) => {
                const item = document.createElement("li");
                const removeButton = document.createElement("button");

                item.append(document.createTextNode(name));
                removeButton.type = "button";
                removeButton.textContent = "Hataein";
                removeButton.setAttribute("aria-label", `${name} ko hataein`);
                removeButton.addEventListener("click", () => {
                    names.splice(index, 1);
                    renderNames();
                });
                item.append(removeButton);
                list.append(item);
            });
        }

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const name = input.value.trim();

            if (!name) {
                message.textContent = "Kripya ek naam likhein.";
                input.focus();
                return;
            }

            names.push(name);
            input.value = "";
            message.textContent = "";
            renderNames();
            input.focus();
        });

        renderNames();
    </script>
</body>
</html>
